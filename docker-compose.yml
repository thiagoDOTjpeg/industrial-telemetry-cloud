services:
  grafana:
    image: grafana/grafana-enterprise
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "localhost.localstack.cloud:host-gateway"
    volumes:
      - grafana-storage:/var/lib/grafana
volumes:
  grafana-storage: {}
